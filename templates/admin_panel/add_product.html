{% extends 'admin_panel/admin_base.html' %}
{% block admin_content %}
<h2 class="fw-bold mb-4">Add Cloths</h2>
<div class="card border-0 shadow-sm col-md-8 p-4">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    {% for c in categories %}
                        <option value="{{ c.id }}">{{ c.category_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Initial Stock Per Size (S, M, L, XL)</label>
                <input type="number" name="initial_stock" value="10" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Regular Price (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Discount Price (₹, optional)</label>
                <input type="number" step="0.01" name="discount_price" class="form-control">
            </div>
        </div>
       <!-- Primary Cover Image -->
        <div class="mb-3">
            <label class="form-label fw-bold">Main Cloths Image (Cover)</label>
            <input type="file" name="image" class="form-control" accept="image/*" required>
        </div>

        <!-- Additional Gallery Images -->
        <div class="mb-3">
            <label class="form-label fw-bold">Multiple Images (Select Multiple)</label>
            <input type="file" name="extra_images" class="form-control" accept="image/*" multiple>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" rows="3" class="form-control" required></textarea>
        </div>
        <button type="submit" class="btn btn-dark">Publish Cloths</button>
        <a href="{% url 'admin_products' %}" class="btn btn-dark">Cancel</a>
    </form>
</div>
{% endblock %}
