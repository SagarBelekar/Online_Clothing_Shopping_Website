<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClothStore Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Top Admin Navigation Bar (Pure Bootstrap 5) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
        <div class="container-fluid px-3 px-lg-4">
            <!-- Brand -->
            <a class="navbar-brand fw-bold fs-5 me-4" href="{% url 'admin_dashboard' %}">
                👑 ClothStore Admin
            </a>

            <!-- Mobile Hamburger Toggle -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarContent" aria-controls="adminNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="adminNavbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
                    <li class="nav-item">
                        <a href="{% url 'admin_dashboard' %}" class="nav-link px-3 rounded {% if request.resolver_match.url_name == 'admin_dashboard' %}active bg-primary text-white fw-semibold{% endif %}">
                            📊 Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'admin_orders' %}" class="nav-link px-3 rounded {% if request.resolver_match.url_name == 'admin_orders' %}active bg-primary text-white fw-semibold{% endif %}">
                            📦 Orders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'admin_products' %}" class="nav-link px-3 rounded {% if request.resolver_match.url_name == 'admin_products' %}active bg-primary text-white fw-semibold{% endif %}">
                            👕 Clothings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'admin_categories' %}" class="nav-link px-3 rounded {% if request.resolver_match.url_name == 'admin_categories' %}active bg-primary text-white fw-semibold{% endif %}">
                            📂 Categories
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'admin_users' %}" class="nav-link px-3 rounded {% if request.resolver_match.url_name == 'admin_users' %}active bg-primary text-white fw-semibold{% endif %}">
                            👥 Customers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'admin_coupons' %}" class="nav-link px-3 rounded {% if request.resolver_match.url_name == 'admin_coupons' %}active bg-primary text-white fw-semibold{% endif %}">
                            🎟️ Coupons
                        </a>
                    </li>
                </ul>

                <!-- Right Side Actions: Profile, View Store & Logout -->
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item">
                        <a href="{% url 'admin_profile' %}" class="nav-link px-3 rounded {% if request.resolver_match.url_name == 'admin_profile' %}active bg-primary text-white fw-semibold{% endif %}">
                            👤 My Profile
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'logout' %}" class="btn btn-danger btn-sm text-nowrap">
                            🚪 Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area: Placed directly below navbar -->
    <main class="container-fluid px-3 px-lg-4 py-4 flex-grow-1">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block admin_content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 Bundle JS (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
