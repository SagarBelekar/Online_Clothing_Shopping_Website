{% extends 'admin_panel/admin_base.html' %}
{% block admin_content %}
<h2 class="fw-bold mb-4">Category Management</h2>
<div class="row g-4">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm p-4">
            <h5 class="fw-bold mb-3">Add Category</h5>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Category Name</label>
                    <input type="text" name="category_name" class="form-control" placeholder="e.g. Shirts, Jeans" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Image</label>
                    <input type="file" name="image" class="form-control">
                </div>
                <button type="submit" class="btn btn-dark w-100">Create Category</button>
            </form>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                    <tr><th>Image</th><th>Name</th><th>Action</th></tr>
                </thead>
                <tbody>
                    {% for cat in categories %}
                    <tr>
                        <td>
                            {% if cat.image %}<img src="{{ cat.image.url }}" style="width: 45px; height: 45px; object-fit: cover;" class="rounded">{% endif %}
                        </td>
                        <td><strong>{{ cat.category_name }}</strong></td>
                        <td><a href="{% url 'admin_delete_category' cat.id %}" onclick="return confirm('Delete?');" class="btn btn-sm btn-outline-danger">Delete</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
